<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="blueSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="emeraldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="amberSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Card Canvas -->
  <rect x="1" y="1" width="638" height="398" rx="10" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="20" y="16" width="600" height="38" rx="7" fill="url(#navyGrad)"/>
  <text x="34" y="40" fill="#ffffff" font-size="13.5" font-weight="700" letter-spacing="0.3">SWE-GPU-Bench</text>
  <text x="160" y="40" fill="#bfdbfe" font-size="11.5" font-weight="500">Executable Real-World CUDA / Triton Evaluation Pipeline</text>
  <rect x="526" y="24" width="82" height="22" rx="4" fill="#1d4ed8" stroke="#60a5fa" stroke-width="0.8"/>
  <text x="567" y="39" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">NeurIPS '26</text>

  <!-- Stage 1: Real-World GPU Repos -->
  <rect x="20" y="72" width="166" height="260" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="20" y="72" width="166" height="30" rx="8" fill="#e2e8f0"/>
  <rect x="20" y="92" width="166" height="10" fill="#e2e8f0"/>
  <text x="103" y="92" fill="#0f172a" font-size="11.5" font-weight="700" text-anchor="middle">CUDA / Triton Repos</text>

  <text x="103" y="121" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">Curated Task Categories</text>

  <!-- 3 Task Pills -->
  <rect x="32" y="132" width="142" height="38" rx="6" fill="url(#blueSoft)" stroke="#93c5fd" stroke-width="1"/>
  <text x="103" y="149" fill="#1e3a8a" font-size="10.5" font-weight="700" text-anchor="middle">1. Bug Fixing</text>
  <text x="103" y="163" fill="#3b82f6" font-size="9" text-anchor="middle">Memory / Sync / Numeric</text>

  <rect x="32" y="180" width="142" height="38" rx="6" fill="url(#blueSoft)" stroke="#93c5fd" stroke-width="1"/>
  <text x="103" y="197" fill="#1e3a8a" font-size="10.5" font-weight="700" text-anchor="middle">2. Feature Impl.</text>
  <text x="103" y="211" fill="#3b82f6" font-size="9" text-anchor="middle">Operators &amp; Kernel APIs</text>

  <rect x="32" y="228" width="142" height="38" rx="6" fill="url(#blueSoft)" stroke="#93c5fd" stroke-width="1"/>
  <text x="103" y="245" fill="#1e3a8a" font-size="10.5" font-weight="700" text-anchor="middle">3. Kernel Perf. Opt.</text>
  <text x="103" y="259" fill="#3b82f6" font-size="9" text-anchor="middle">Tiling / Fusion / Throughput</text>

  <rect x="32" y="279" width="142" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,2" stroke-width="1.1"/>
  <text x="103" y="296" fill="#334155" font-size="9.8" font-weight="600" text-anchor="middle">Executable Transformation</text>
  <text x="103" y="310" fill="#64748b" font-size="8.8" text-anchor="middle">Build + Test Constraints</text>

  <!-- Arrow Stage 1 -> Stage 2 -->
  <line x1="186" y1="202" x2="212" y2="202" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>

  <!-- Stage 2: LLM Patch + Isolated Replay -->
  <rect x="216" y="72" width="168" height="260" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="216" y="72" width="168" height="30" rx="8" fill="#dbeafe"/>
  <rect x="216" y="92" width="168" height="10" fill="#dbeafe"/>
  <text x="300" y="92" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">Agent &amp; GPU Replay</text>

  <!-- LLM Node -->
  <rect x="230" y="116" width="140" height="52" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="300" y="136" fill="#0f172a" font-size="10.8" font-weight="700" text-anchor="middle">LM / Coding Agent</text>
  <text x="300" y="152" fill="#475569" font-size="9.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">patch.diff (.cu / .py)</text>

  <line x1="300" y1="168" x2="300" y2="194" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <!-- Isolated Replay Container -->
  <rect x="230" y="198" width="140" height="118" rx="6" fill="url(#amberSoft)" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="300" y="218" fill="#92400e" font-size="10.5" font-weight="700" text-anchor="middle">Isolated GPU Env</text>
  <line x1="242" y1="226" x2="358" y2="226" stroke="#fcd34d" stroke-width="1"/>
  <text x="300" y="244" fill="#78350f" font-size="9.4" font-weight="600" text-anchor="middle">&#8226; Hermetic Build &amp; Compile</text>
  <text x="300" y="262" fill="#78350f" font-size="9.4" font-weight="600" text-anchor="middle">&#8226; Deterministic Replay</text>
  <text x="300" y="280" fill="#78350f" font-size="9.4" font-weight="600" text-anchor="middle">&#8226; Hardware Isolation</text>
  <text x="300" y="302" fill="#b45309" font-size="8.8" font-style="italic" text-anchor="middle">Reproducible Execution</text>

  <!-- Arrow Stage 2 -> Stage 3 -->
  <line x1="384" y1="202" x2="410" y2="202" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>

  <!-- Stage 3: Dual-Gate Verification -->
  <rect x="414" y="72" width="206" height="260" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <rect x="414" y="72" width="206" height="30" rx="8" fill="#d1fae5"/>
  <rect x="414" y="92" width="206" height="10" fill="#d1fae5"/>
  <text x="517" y="92" fill="#065f46" font-size="11.5" font-weight="700" text-anchor="middle">Dual-Gate Verification</text>

  <!-- Gate 1 -->
  <rect x="428" y="116" width="178" height="68" rx="6" fill="url(#emeraldSoft)" stroke="#34d399" stroke-width="1.2"/>
  <text x="517" y="135" fill="#065f46" font-size="10.8" font-weight="700" text-anchor="middle">Gate 1: Correctness</text>
  <text x="517" y="152" fill="#047857" font-size="9.3" text-anchor="middle">Automated Test Suite</text>
  <text x="517" y="168" fill="#047857" font-size="9.0" text-anchor="middle">Numerical &amp; Edge-Case Checks</text>

  <line x1="517" y1="184" x2="517" y2="204" stroke="#059669" stroke-width="1.6" marker-end="url(#arrowGreen)"/>

  <!-- Gate 2 -->
  <rect x="428" y="208" width="178" height="68" rx="6" fill="url(#emeraldSoft)" stroke="#34d399" stroke-width="1.2"/>
  <text x="517" y="227" fill="#065f46" font-size="10.8" font-weight="700" text-anchor="middle">Gate 2: Performance</text>
  <text x="517" y="244" fill="#047857" font-size="9.3" text-anchor="middle">Regression Pipeline</text>
  <text x="517" y="260" fill="#047857" font-size="9.0" text-anchor="middle">Kernel Speedup &amp; No Regression</text>

  <!-- Final Pass Badge -->
  <rect x="428" y="288" width="178" height="30" rx="6" fill="#065f46"/>
  <text x="517" y="307" fill="#ffffff" font-size="10.2" font-weight="700" text-anchor="middle">Resolved: Gate 1 + Gate 2 Pass</text>

  <!-- Footer Summary Bar -->
  <rect x="20" y="346" width="600" height="36" rx="6" fill="#e2e8f0"/>
  <text x="320" y="368" fill="#1e293b" font-size="10.5" font-weight="600" text-anchor="middle">End-to-End Benchmark for Functional Correctness &amp; Kernel Performance in Real GPU Codebases</text>
</svg>
