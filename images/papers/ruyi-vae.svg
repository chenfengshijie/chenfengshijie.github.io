<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="rvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="rvHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="encGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <linearGradient id="decGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <marker id="rvArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="638" height="398" rx="10" fill="url(#rvBg)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="20" y="16" width="600" height="38" rx="7" fill="url(#rvHead)"/>
  <text x="34" y="40" fill="#ffffff" font-size="13.5" font-weight="700">RUYI-VAE</text>
  <text x="116" y="40" fill="#99f6e4" font-size="11.5" font-weight="500">Robust and Scalable Spatiotemporal Compressor for Video Generation</text>

  <!-- Main Architecture Frame -->
  <rect x="20" y="68" width="600" height="264" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>

  <!-- Input Video Volume (Frames Stack) -->
  <g transform="translate(36, 114)">
    <rect x="0" y="24" width="68" height="86" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
    <rect x="10" y="12" width="68" height="86" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
    <rect x="20" y="0" width="68" height="86" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
    <line x1="30" y1="22" x2="78" y2="22" stroke="#93c5fd" stroke-width="1.2"/>
    <line x1="30" y1="42" x2="78" y2="42" stroke="#93c5fd" stroke-width="1.2"/>
    <line x1="30" y1="62" x2="78" y2="62" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="44" y="132" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">Input Video</text>
    <text x="44" y="147" fill="#64748b" font-size="9.2" text-anchor="middle">Pixel Space (T&#215;H&#215;W)</text>
  </g>

  <line x1="132" y1="170" x2="160" y2="170" stroke="#0f766e" stroke-width="1.8" marker-end="url(#rvArrow)"/>

  <!-- Spatiotemporal Encoder Trapezoid -->
  <polygon points="166,104 264,128 264,212 166,236" fill="url(#encGrad)" stroke="#0d9488" stroke-width="1.5"/>
  <text x="215" y="164" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">Spatiotemporal</text>
  <text x="215" y="180" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">Encoder</text>
  <text x="215" y="256" fill="#0f766e" font-size="9.2" font-weight="600" text-anchor="middle">Spatial + Temporal</text>
  <text x="215" y="269" fill="#64748b" font-size="8.8" text-anchor="middle">Joint Compression</text>

  <line x1="266" y1="170" x2="292" y2="170" stroke="#0f766e" stroke-width="1.8" marker-end="url(#rvArrow)"/>

  <!-- Compact Latent Cube -->
  <rect x="296" y="128" width="68" height="84" rx="7" fill="#0f766e" stroke="#115e59" stroke-width="1.5"/>
  <rect x="306" y="138" width="20" height="20" rx="3" fill="#5eead4" opacity="0.85"/>
  <rect x="334" y="138" width="20" height="20" rx="3" fill="#99f6e4" opacity="0.85"/>
  <rect x="306" y="166" width="20" height="20" rx="3" fill="#99f6e4" opacity="0.85"/>
  <rect x="334" y="166" width="20" height="20" rx="3" fill="#2dd4bf" opacity="0.85"/>
  <text x="330" y="203" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">Latent z</text>

  <!-- Video Generation Interface Callout above Latent -->
  <rect x="266" y="78" width="128" height="30" rx="5" fill="#f0fdfa" stroke="#14b8a6" stroke-dasharray="3,2" stroke-width="1.2"/>
  <text x="330" y="97" fill="#0f766e" font-size="9.5" font-weight="700" text-anchor="middle">Video Diffusion Space</text>
  <line x1="330" y1="108" x2="330" y2="126" stroke="#14b8a6" stroke-width="1.3" stroke-dasharray="2,2"/>

  <line x1="366" y1="170" x2="392" y2="170" stroke="#0f766e" stroke-width="1.8" marker-end="url(#rvArrow)"/>

  <!-- Spatiotemporal Decoder Trapezoid -->
  <polygon points="396,128 494,104 494,236 396,212" fill="url(#decGrad)" stroke="#0d9488" stroke-width="1.5"/>
  <text x="445" y="164" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">Spatiotemporal</text>
  <text x="445" y="180" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">Decoder</text>
  <text x="445" y="256" fill="#0f766e" font-size="9.2" font-weight="600" text-anchor="middle">High-Fidelity</text>
  <text x="445" y="269" fill="#64748b" font-size="8.8" text-anchor="middle">Motion &amp; Detail</text>

  <line x1="496" y1="170" x2="524" y2="170" stroke="#0f766e" stroke-width="1.8" marker-end="url(#rvArrow)"/>

  <!-- Reconstructed Video Volume -->
  <g transform="translate(528, 114)">
    <rect x="0" y="24" width="64" height="86" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
    <rect x="8" y="12" width="64" height="86" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
    <rect x="16" y="0" width="64" height="86" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <line x1="25" y1="22" x2="71" y2="22" stroke="#6ee7b7" stroke-width="1.2"/>
    <line x1="25" y1="42" x2="71" y2="42" stroke="#6ee7b7" stroke-width="1.2"/>
    <line x1="25" y1="62" x2="71" y2="62" stroke="#6ee7b7" stroke-width="1.2"/>
    <text x="40" y="132" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">Reconstruction</text>
    <text x="40" y="147" fill="#64748b" font-size="9.2" text-anchor="middle">Coherent Video</text>
  </g>

  <!-- Design Pillars inside Frame -->
  <rect x="76" y="290" width="224" height="28" rx="5" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="188" y="308" fill="#115e59" font-size="10" font-weight="700" text-anchor="middle">Robust Spatiotemporal Representation</text>

  <rect x="340" y="290" width="224" height="28" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="452" y="308" fill="#1e3a8a" font-size="10" font-weight="700" text-anchor="middle">Scalable Latent Video Modeling</text>

  <!-- Footer -->
  <rect x="20" y="346" width="600" height="36" rx="6" fill="#e2e8f0"/>
  <text x="320" y="368" fill="#1e293b" font-size="10.5" font-weight="600" text-anchor="middle">Co-authored Video Autoencoder Architecture Balancing Robustness and Scalability for Video Generation</text>
</svg>
